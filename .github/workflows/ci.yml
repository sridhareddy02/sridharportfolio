name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit-test the statistics library against scipy reference values
        run: node --test "tests/*.test.mjs"
